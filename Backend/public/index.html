<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Misconceptions</title>
    <style>
        :root {
            --bg-color: #0f172a; /* Slate 900 */
            --card-bg: #1e293b; /* Slate 800 */
            --text-main: #f8fafc; /* Slate 50 */
            --text-muted: #94a3b8; /* Slate 400 */
            --accent: #38bdf8; /* Sky 400 */
            --danger: #ef4444; /* Red 500 */
            --warning: #f59e0b; /* Amber 500 */
            --border: #334155; /* Slate 700 */
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }
        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        th {
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }
        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
            transition: background-color 0.15s ease;
        }
        .rate-high {
            color: var(--danger);
            font-weight: bold;
        }
        .rate-med {
            color: var(--warning);
            font-weight: bold;
        }
        .rate-low {
            color: var(--text-muted);
        }
        .root-cause {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            display: inline-block;
        }
        .empty-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Teacher Dashboard</h1>
    <p class="subtitle">Class-level misconception aggregation and root cause analysis.</p>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Topic (Section Label)</th>
                    <th>Incorrect Rate</th>
                    <th>Total Attempts</th>
                    <th>Most Common Root Cause (Prerequisite Gap)</th>
                </tr>
            </thead>
            <tbody id="misconception-body">
                <!-- Data populated by JS -->
            </tbody>
        </table>
        <div id="loading" class="empty-state">Loading aggregated data...</div>
    </div>
</div>

<script>
    async function loadData() {
        const tbody = document.getElementById('misconception-body');
        const loading = document.getElementById('loading');
        
        try {
            const response = await fetch('/api/misconceptions');
            const data = await response.json();
            
            loading.style.display = 'none';

            if (!data.misconceptions || data.misconceptions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No class data available yet.</td></tr>';
                return;
            }

            tbody.innerHTML = data.misconceptions.map(item => {
                const perc = (item.incorrect_rate * 100).toFixed(1) + '%';
                let rateClass = 'rate-low';
                if (item.incorrect_rate >= 0.4) rateClass = 'rate-high';
                else if (item.incorrect_rate >= 0.2) rateClass = 'rate-med';

                const rootCauseHtml = item.most_common_gap 
                    ? `<span class="root-cause">${item.most_common_gap.section_label} (${item.most_common_gap.frequency} students)</span>`
                    : '<span style="color: var(--text-muted)">-</span>';

                return `
                    <tr>
                        <td><strong>${item.section_label}</strong></td>
                        <td class="${rateClass}">${perc}</td>
                        <td>${item.total_attempts}</td>
                        <td>${rootCauseHtml}</td>
                    </tr>
                `;
            }).join('');
            
        } catch (err) {
            console.error(err);
            loading.textContent = 'Failed to load data. Please check the backend.';
        }
    }

    loadData();
</script>

</body>
</html>
